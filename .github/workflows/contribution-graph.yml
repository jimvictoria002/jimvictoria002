# Builds the contribution line chart shown in README.md and publishes it to
# the `output` branch, so the profile never depends on a third-party image
# server (github-readme-activity-graph.vercel.app was taken down).
name: Contribution graph

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Draw activity graph
        run: |
          mkdir -p dist
          node .github/scripts/activity-graph.mjs "${{ github.repository_owner }}" dist/activity-graph.svg "Jimuel Victoria"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution graph"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
